name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: webauthn-audit lint examples/insecure-registration-options.json --profile passkey --format sarif --output result.sarif || test $? -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sarif-${{ matrix.python-version }}
          path: result.sarif
