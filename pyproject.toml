[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "webauthn-audit"
version = "0.1.0"
description = "Offline-first WebAuthn and passkey ceremony auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liam Giannini, Webcracy.ch" }]
keywords = ["webauthn", "passkeys", "fido2", "security", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["tomli>=2.2,<3; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
webauthn-audit = "webauthn_audit.cli:main"

[project.urls]
Homepage = "https://webcracy.ch"
Repository = "https://github.com/Liam-G/webauthn-audit"
Issues = "https://github.com/Liam-G/webauthn-audit/issues"
Changelog = "https://github.com/Liam-G/webauthn-audit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Liam-G/webauthn-audit#readme"
"Security policy" = "https://github.com/Liam-G/webauthn-audit/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/webauthn_audit"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=webauthn_audit --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["webauthn_audit"]
